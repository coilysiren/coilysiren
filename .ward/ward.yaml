# README, AGENTS, and FEATURES to link it, both upstream in agentic-os. See
# agentic-os#1101.

# Schema: relaxed in agentic-os v0.19.0 (description + dependsOn required;
# kind / type / system / owner / lifecycle deprecated, pending fleet strip).
# Tracker: https://forgejo.coilysiren.me/coilyco-bridge/agentic-os-kai/issues/643
catalog:
  description: "GitHub profile README. Landing page for the lights-out factory."
  dependsOn: []
  providesApis: []
